name: Poisson electrostatic diagnostics

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/poisson-electrostatic.yml"
      - "src/core_atmosphere/electrostatic/**"
      - "RUN.md"
      - "BUILD.md"
      - "docs/design/poisson/**"
  pull_request:
    paths:
      - ".github/workflows/poisson-electrostatic.yml"
      - "src/core_atmosphere/electrostatic/**"
      - "RUN.md"
      - "BUILD.md"
      - "docs/design/poisson/**"

permissions:
  contents: read

jobs:
  python-helper-tests:
    name: Python helper tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install matplotlib netCDF4 numpy scipy

      - name: Compile electrostatic helper scripts
        run: |
          python -m py_compile \
            src/core_atmosphere/electrostatic/scripts/run_tier_A1_cartesian_mms.py \
            src/core_atmosphere/electrostatic/scripts/run_tier_A2_sphere_mms.py \
            src/core_atmosphere/electrostatic/scripts/setup_tier_A2_sphere_meshes.py \
            src/core_atmosphere/electrostatic/scripts/prototype_tier_A2_defect_correction.py \
            src/core_atmosphere/electrostatic/scripts/run_tripole_supercell.py

      - name: Run electrostatic Python tests
        run: |
          python src/core_atmosphere/electrostatic/tests/test_tier_A1_script.py
          python src/core_atmosphere/electrostatic/tests/test_tier_A2_script.py
          python src/core_atmosphere/electrostatic/tests/test_tier_A2_defect_correction.py
          python src/core_atmosphere/electrostatic/tests/test_tripole_supercell_script.py
